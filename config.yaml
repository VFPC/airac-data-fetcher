# AIRAC Data Fetcher configuration
# ---
# This file is committed to version control with safe default values.
# Create config.local.yaml (gitignored) to override workspace_base and
# archive_repo for your machine without touching this file.

# Directory on your machine where per-cycle working directories are created.
# Each cycle gets a sub-directory named "vFPC YYNN" (e.g. "vFPC 2603").
# Override in config.local.yaml.
workspace_base: ""

# Path to your local clone of VFPC/airac-data.
# The archiver writes the zip and manifest here, then runs git add.
# Override in config.local.yaml.
archive_repo: ""

sources:
  nats_srd:
    # Override only if the NATS EAD page URL changes.
    # Leave blank to use the hardcoded default in nats_srd.py.
    page_url: ""
    # [RULE:SRD-EXCEL-STRUCTURE] Sheet names are NATS publishing conventions.
    sheet_name: "Routes"
    notes_sheet: "Notes"
  vatsim_sct:
    # Not currently used — the SCT fetcher queries the GitHub releases API
    # directly via a hardcoded URL. Reserved for future override.
    url: ""
  eaip:
    # Override only if the NATS AIP page URL changes.
    # Leave blank to use the hardcoded default in eaip_html.py.
    page_url: ""
    files:
      - "EG-ENR-3.2-en-GB.html"
      - "EG-ENR-3.3-en-GB.html"
