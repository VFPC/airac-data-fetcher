# AIRAC Data Fetcher configuration
# ---
# This file is committed to version control with safe default values.
# Create config.local.yaml (gitignored) to override workspace_base
# for your machine without touching this file.
#
# To archive prepared cycle data, use the airac-archiver tool:
# https://github.com/VFPC/airac-archiver

# Directory on your machine where per-cycle working directories are created.
# Each cycle gets a sub-directory named "vFPC YYNN" (e.g. "vFPC 2603").
# Override in config.local.yaml.
workspace_base: ""

sources:
  nats_srd:
    # NATS SRD download page (informational — the fetcher constructs the
    # zip URL directly from the cycle ident via [RULE:SRD-DOWNLOAD-URL]).
    page_url: "https://nats-uk.ead-it.com/cms-nats/opencms/en/Publications/digital-datasets/SRD/"
    # [RULE:SRD-EXCEL-STRUCTURE] Sheet names are NATS publishing conventions.
    sheet_name: "Routes"
    notes_sheet: "Notes"
  vatsim_sct:
    # Not currently used — the SCT fetcher queries the GitHub releases API
    # directly via a hardcoded URL. Reserved for future override.
    url: ""
  eaip:
    # NATS AIP offline HTML download page. Override here if the URL changes;
    # this value is passed to the fetcher as index_url.
    # Confirmed working 2026-03-20 (issue #1 live end-to-end test).
    page_url: "https://nats-uk.ead-it.com/cms-nats/opencms/en/Publications/AIP/"
    files:
      - "EG-ENR-3.2-en-GB.html"
      - "EG-ENR-3.3-en-GB.html"
      - "EG-ENR-4.1-en-GB.html"
      - "EG-ENR-4.2-en-GB.html"
      - "EG-ENR-4.4-en-GB.html"
  irish_eaip:
    # AirNav Ireland IAIP package page. ENR 4.4 PDF link is scraped from here
    # each cycle — the GUID in the download URL changes when AirNav updates the
    # document. Override if the page URL moves. [RULE:IRISH-EAIP-ENR44-URL]
    # Confirmed working 2026-03-31.
    page_url: "https://www.airnav.ie/air-traffic-management/aeronautical-information-management/aip-package"
